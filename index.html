<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tokyo J-</title>
  <meta name="description" content="Compte à rebours avant le départ pour Tokyo">
  <meta name="theme-color" content="#ffd6e7">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Applique le thème enregistré avant l'affichage (évite un flash de couleurs).
    try {
      var t = (JSON.parse(localStorage.getItem("compte-a-rebours-japon") || "{}") || {}).theme;
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="petales" aria-hidden="true"></div>

  <main class="page">
    <p class="pastille" id="pastille">東京まで ・ direction Tokyo</p>

    <svg class="fuji" viewBox="0 0 240 150" aria-hidden="true">
      <g class="f-nuage">
        <ellipse cx="40" cy="40" rx="22" ry="12"/><ellipse cx="58" cy="34" rx="16" ry="12"/>
        <ellipse cx="200" cy="56" rx="20" ry="10"/><ellipse cx="185" cy="52" rx="13" ry="10"/>
      </g>
      <circle class="f-soleil" cx="190" cy="28" r="16"/>
      <g class="f-cornes">
        <path d="M102 40 Q86 30 78 16 Q75 38 90 54 Z"/>
        <path d="M138 40 Q154 30 162 16 Q165 38 150 54 Z"/>
      </g>
      <path class="f-mont" d="M10 148 L104 30 Q120 14 136 30 L230 148 Z"/>
      <path class="f-neige" d="M86 52 L104 30 Q120 14 136 30 L154 52 Q146 62 138 54 Q130 64 120 54 Q110 64 102 54 Q94 62 86 52 Z"/>
      <circle class="f-yeux" cx="104" cy="88" r="5"/>
      <circle class="f-yeux" cx="136" cy="88" r="5"/>
      <circle class="f-reflet" cx="106" cy="86" r="1.6"/><circle class="f-reflet" cx="138" cy="86" r="1.6"/>
      <ellipse class="f-joue" cx="94" cy="100" rx="8" ry="5"/>
      <ellipse class="f-joue" cx="146" cy="100" rx="8" ry="5"/>
      <path class="f-bouche" d="M113 98 Q120 106 127 98"/>
      <path class="f-crocs" d="M113 100 L115.5 107 L118 102 Z M122 102 L124.5 107 L127 100 Z"/>
    </svg>

    <section class="carte" aria-live="polite">
      <p class="avant" id="avant">あと</p>
      <p class="nombre" id="nombre">–</p>
      <p class="unite" id="unite">jours</p>
      <p class="message" id="message"></p>
      <div class="minuteur" id="minuteur" hidden>
        <div><b id="mj">0</b><span>j</span></div>
        <div><b id="mh">00</b><span>h</span></div>
        <div><b id="mm">00</b><span>min</span></div>
        <div><b id="ms">00</b><span>s</span></div>
      </div>
      <p class="date" id="date"></p>
    </section>

    <button class="reglages" id="ouvrir" type="button" aria-label="Réglages" title="Réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-linecap="round">
          <g stroke-width="4" stroke-linecap="butt">
            <path d="M12 2v4"/><path d="M12 2v4" transform="rotate(45 12 12)"/>
            <path d="M12 2v4" transform="rotate(90 12 12)"/><path d="M12 2v4" transform="rotate(135 12 12)"/>
            <path d="M12 2v4" transform="rotate(180 12 12)"/><path d="M12 2v4" transform="rotate(225 12 12)"/>
            <path d="M12 2v4" transform="rotate(270 12 12)"/><path d="M12 2v4" transform="rotate(315 12 12)"/>
          </g>
          <circle cx="12" cy="12" r="6" stroke-width="3"/>
          <circle cx="12" cy="12" r="2.4" stroke-width="1.8"/>
        </g>
      </svg>
    </button>
  </main>

  <dialog id="dialogue">
    <form method="dialog" id="formulaire">
      <h2>Réglages ✿</h2>
      <fieldset class="voyageuses">
        <legend>Les voyageuses (facultatif)</legend>
        <div class="deux-champs">
          <input type="text" id="prenom1" maxlength="30" autocomplete="off" placeholder="Prénom" aria-label="Prénom de la première voyageuse">
          <span aria-hidden="true">&amp;</span>
          <input type="text" id="prenom2" maxlength="30" autocomplete="off" placeholder="Prénom" aria-label="Prénom de la deuxième voyageuse">
        </div>
      </fieldset>
      <label>Date du départ
        <input type="date" id="champ-date" required>
      </label>
      <label class="case"><input type="checkbox" id="provisoire"> Date encore provisoire</label>
      <label>Heure du vol, heure de Paris (facultatif)
        <input type="time" id="champ-heure">
      </label>
      <p class="aide">Sans heure, l'appli compte les jours. Avec une heure, elle affiche aussi les heures, minutes et secondes.</p>
      <fieldset class="themes">
        <legend>Thème</legend>
        <label><input type="radio" name="theme" value="kawaii"><span class="apercu apercu-kawaii"></span>Kawaii pastel</label>
        <label><input type="radio" name="theme" value="neon"><span class="apercu apercu-neon"></span>Tokyo néon</label>
        <label><input type="radio" name="theme" value="cyberpunk"><span class="apercu apercu-cyberpunk"></span>Cyberpunk</label>
        <label><input type="radio" name="theme" value="washi"><span class="apercu apercu-washi"></span>Estampe</label>
        <label><input type="radio" name="theme" value="ghibli"><span class="apercu apercu-ghibli"></span>Ghibli</label>
        <label><input type="radio" name="theme" value="yokai"><span class="apercu apercu-yokai"></span>Yōkai</label>
      </fieldset>
      <div class="installer" id="installer" hidden>
        <p class="installer-titre">📲 Avoir l'appli sur l'écran d'accueil</p>
        <button type="button" id="bouton-installer" class="secondaire" hidden>Installer l'appli</button>
        <p class="aide" id="installer-aide"></p>
      </div>
      <div class="boutons">
        <button type="button" id="annuler" class="secondaire">Annuler</button>
        <button type="submit" id="enregistrer">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="countdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
